# Conexión MySQL
# Local (mvnw): MySQL en localhost, levantado con "docker compose up db".
# En Docker Compose estas propiedades se pisan con las variables de entorno
# SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD definidas en docker-compose.yml.
spring.datasource.url=jdbc:mysql://localhost:3306/burgerflow?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
