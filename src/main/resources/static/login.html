<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar · BurgerManager</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="top-bar">
  <div class="wrap">
    <a href="index.html" class="brand">BURGUER<span>FLOW</span></a>
    <nav class="main-nav">
      <a href="index.html">Menú</a>
      <a href="carrito.html">Carrito</a>
      <span id="nav-usuario"></span>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="form-card">
      <h2>Ingresá a tu cuenta</h2>
      <div class="form-mensaje" id="mensaje"></div>
      <form id="form-login">
        <div class="campo">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="usuario@dominio.com">
        </div>
        <div class="campo">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Ingresar</button>
      </form>
      <p class="form-footer">¿No tenés cuenta? <a href="registro.html">Registrate</a></p>
      <p class="form-footer" style="font-size:0.78rem">
        Usuarios de prueba: admin@burgermanager.com / Admin1234 &middot;
        cocina@burgermanager.com / Cocina1234 &middot;
        cliente@burgermanager.com / Cliente1234
      </p>
    </div>
  </div>
</main>

<footer class="site-footer">BurgerManager · Trabajo Integrador · Programación en Nuevas Tecnologías I · ORT</footer>

<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script>
document.getElementById('form-login').addEventListener('submit', async (e) => {
  e.preventDefault();
  const mensaje = document.getElementById('mensaje');
  mensaje.className = 'form-mensaje';
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  try {
    const resp = await Api.login(email, password);
    Api.guardarSesion(resp);
    window.location.href = 'index.html';
  } catch (err) {
    mensaje.textContent = err.message;
    mensaje.className = 'form-mensaje error';
  }
});
</script>
</body>
</html>
