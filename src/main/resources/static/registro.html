<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear cuenta · BurgerManager</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="top-bar">
  <div class="wrap">
    <a href="index.html" class="brand">BURGUER<span>FLOW</span></a>
    <nav class="main-nav">
      <a href="index.html">Menú</a>
      <a href="carrito.html">Carrito</a>
      <span id="nav-usuario"></span>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="form-card">
      <h2>Creá tu cuenta</h2>
      <div class="form-mensaje" id="mensaje"></div>
      <form id="form-registro">
        <div class="campo">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" required placeholder="Juan Pérez">
        </div>
        <div class="campo">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="usuario@dominio.com">
        </div>
        <div class="campo">
          <label for="telefono">Teléfono (opcional)</label>
          <input type="text" id="telefono" placeholder="11 5555-5555">
        </div>
        <div class="campo">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required placeholder="Mínimo 8 caracteres, 1 letra y 1 número">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Crear cuenta</button>
      </form>
      <p class="form-footer">¿Ya tenés cuenta? <a href="login.html">Ingresá</a></p>
    </div>
  </div>
</main>

<footer class="site-footer">BurgerManager · Trabajo Integrador · Programación en Nuevas Tecnologías I · ORT</footer>

<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script>
document.getElementById('form-registro').addEventListener('submit', async (e) => {
  e.preventDefault();
  const mensaje = document.getElementById('mensaje');
  mensaje.className = 'form-mensaje';

  const datos = {
    nombre: document.getElementById('nombre').value.trim(),
    email: document.getElementById('email').value.trim(),
    telefono: document.getElementById('telefono').value.trim(),
    password: document.getElementById('password').value
  };

  try {
    const resp = await Api.registrar(datos);
    Api.guardarSesion(resp);
    window.location.href = 'index.html';
  } catch (err) {
    mensaje.textContent = err.message;
    mensaje.className = 'form-mensaje error';
  }
});
</script>
</body>
</html>
