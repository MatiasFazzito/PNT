<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>BurgerFlow - Nuevo Producto</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container">
        <div class="card form-card">
            <h2>Agregar Nuevo Producto</h2>
            <form th:action="@{/admin/productos/guardar}" th:object="${producto}" method="post">
                <div class="form-group">
                    <label>Nombre:</label>
                    <input type="text" th:field="*{nombre}" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Descripción:</label>
                    <input type="text" th:field="*{descripcion}" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Categoría:</label>
                    <select th:field="*{categoria}" class="form-control">
                        <option value="Hamburguesas">Hamburguesas</option>
                        <option value="Acompañamientos">Acompañamientos</option>
                        <option value="Bebidas">Bebidas</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Precio ($):</label>
                    <input type="number" step="0.01" th:field="*{precio}" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Stock Inicial:</label>
                    <input type="number" th:field="*{stock}" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-block">Guardar Producto</button>
            </form>
        </div>
    </main>

    <script th:src="@{/js/scripts.js}"></script>
</body>
</html>
