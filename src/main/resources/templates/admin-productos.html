<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>BurgerFlow - Administrar Catálogo</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
            <h2>Gestión de Catálogo y Stock</h2>
            <a href="/admin/productos/nuevo" class="btn">+ Nuevo Producto</a>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th>Precio</th>
                        <th>Stock</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="prod : ${productos}">
                        <td th:text="${prod.id}">1</td>
                        <td th:text="${prod.nombre}">Nombre</td>
                        <td th:text="${prod.categoria}">Cat</td>
                        <td th:text="${'$' + prod.precio}">$0</td>
                        <td th:text="${prod.stock}">0</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script th:src="@{/js/scripts.js}"></script>
</body>
</html>
