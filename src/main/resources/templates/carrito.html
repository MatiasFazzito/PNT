<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>BurgerFlow - Carrito</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container">
        <h2 style="margin-bottom: 1.5rem;">Tu Carrito de Compras</h2>
        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Precio Un.</th>
                        <th>Cantidad</th>
                        <th>Subtotal</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tabla-carrito">
                </tbody>
            </table>
            <div style="margin-top: 2rem; display: flex; justify-content: space-between; align-items: center;">
                <h3 style="font-size: 1.5rem;">Total: $<span id="total-carrito">0</span></h3>
                <button class="btn" onclick="finalizarPedido()">Confirmar Pedido</button>
            </div>
        </div>
    </main>

    <script th:src="@{/js/scripts.js}"></script>
</body>
</html>
