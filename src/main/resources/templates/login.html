<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>BurgerFlow - Login</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container">
        <div class="card form-card">
            <h2>Iniciar Sesión</h2>
            <form action="/menu" method="get">
                <div class="form-group">
                    <label>Correo Electrónico:</label>
                    <input type="email" name="email" class="form-control" required placeholder="ejemplo@dominio.com">
                </div>
                <div class="form-group">
                    <label>Contraseña:</label>
                    <input type="password" name="password" class="form-control" required placeholder="Mínimo 8 caracteres">
                </div>
                <button type="submit" class="btn btn-block">Ingresar</button>
            </form>
            <p style="text-align: center; margin-top: 1rem;">
                ¿No tienes cuenta? <a href="/registro">Regístrate aquí</a>
            </p>
        </div>
    </main>

    <script th:src="@{/js/scripts.js}"></script>
</body>
</html>
