<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>BurgerFlow - Menú</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container">
        <h2 style="margin-bottom: 1.5rem;">Nuestro Menú</h2>
        <div class="grid">
            <div class="card" th:each="producto : ${productos}">
                <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                    <h3 th:text="${producto.nombre}">Nombre Producto</h3>
                    <span class="badge" th:text="${producto.categoria}">Categoría</span>
                </div>
                <p th:text="${producto.descripcion}" style="color: var(--text-muted); margin-top: 0.5rem; font-size: 0.95rem;">
                    Descripción del producto...
                </p>
                <div class="price" th:text="${'$' + producto.precio}">$0.0</div>
                <button class="btn btn-block" 
                        th:attr="onclick=|agregarAlCarrito('${producto.id}', '${producto.nombre}', ${producto.precio}, ${producto.stock})|">
                    Agregar al Carrito
                </button>
            </div>
        </div>
    </main>

    <script th:src="@{/js/scripts.js}"></script>
</body>
</html>
