<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis pedidos · BurgerManager</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header class="top-bar">
    <div class="wrap">
      <a th:href="@{/}" class="brand">BURGUER<span>FLOW</span></a>
      <nav class="main-nav">
        <a th:href="@{/}">Menú</a>
        <a th:href="@{/carrito}">Carrito</a>
        <a th:href="@{/mis-pedidos}" data-rol="CLIENTE" class="oculto">Mis pedidos</a>
        <a th:href="@{/cocina}" data-rol="EMPLEADO,ADMIN" class="oculto">Cocina</a>
        <a th:href="@{/admin}" data-rol="ADMIN" class="oculto">Administración</a>
        <div id="nav-usuario"></div>
      </nav>
    </div>
  </header>

  <main>
    <div class="wrap">
      <h2 class="section-title">Mis pedidos</h2>
      <p class="section-sub">Acá vas a ver el estado de cada pedido en tiempo real (actualizá la página para refrescar).
      </p>
      <button id="btn-refrescar" class="btn btn-outline btn-sm" style="margin-bottom:20px">Actualizar</button>
      <div class="lista-pedidos" id="lista-pedidos">
        <p class="vacio">Cargando tus pedidos...</p>
      </div>
    </div>
  </main>

  <footer class="site-footer">BurgerManager · Trabajo Integrador · Programación en Nuevas Tecnologías I · ORT</footer>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/estados.js"></script>
  <script src="js/pedidos-cliente.js"></script>
</body>

</html>
