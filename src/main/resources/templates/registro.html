<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta · BurgerManager</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

  <header class="top-bar">
    <div class="wrap">
      <a th:href="@{/}" class="brand">BURGUER<span>FLOW</span></a>
      <nav class="main-nav">
        <a th:href="@{/}">Menú</a>
        <a th:href="@{/carrito}">Carrito</a>
        <a th:href="@{/mis-pedidos}" data-rol="CLIENTE" class="oculto">Mis pedidos</a>
        <a th:href="@{/cocina}" data-rol="EMPLEADO,ADMIN" class="oculto">Cocina</a>
        <a th:href="@{/admin}" data-rol="ADMIN" class="oculto">Administración</a>
        <div id="nav-usuario"></div>
      </nav>
    </div>
  </header>

  <main>
    <div class="wrap">
      <div class="form-card">
        <h2>Creá tu cuenta</h2>
        <div class="form-mensaje" id="mensaje"></div>
        <form id="form-registro">
          <div class="campo">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" required placeholder="Juan Pérez">
          </div>
          <div class="campo">
            <label for="email">Email</label>
            <input type="email" id="email" required placeholder="usuario@dominio.com">
          </div>
          <div class="campo">
            <label for="telefono">Teléfono (opcional)</label>
            <input type="text" id="telefono" placeholder="11 5555-5555">
          </div>
          <div class="campo">
            <label for="password">Contraseña</label>
            <input type="password" id="password" required placeholder="Mínimo 8 caracteres, 1 letra y 1 número">
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%">Crear cuenta</button>
        </form>
        <p class="form-footer">¿Ya tenés cuenta? <a th:href="@{/login}">Ingresá</a></p>
      </div>
    </div>
  </main>

  <footer class="site-footer">BurgerManager · Trabajo Integrador · Programación en Nuevas Tecnologías I · ORT</footer>

  <script th:src="@{/js/api.js}"></script>
  <script th:src="@{/js/layout.js}"></script>
  <script th:src="@{/js/registro.js}"></script>
</body>

</html>
